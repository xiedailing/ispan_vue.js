<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>命令式渲染範例</title>
  <link rel="stylesheet" href="../basic.css">
</head>
<body>
  <div class="card">
    <h2>色票清單（命令式渲染）</h2>
    <p class="muted">要自己一步一步告訴瀏覽器「怎麼把畫面做出來」</p>
    <ul id="swatchList" class="swatch-list"></ul>
  </div>

  <script>
    const colors = [
      { name: '珊瑚橘', color: '#ff8a65' },
      { name: '蜜桃粉', color: '#ffd6e0' },
      { name: '天空藍', color: '#cfe8ff' },
      { name: '抹茶綠', color: '#d8f5d0' }
    ]

    const list = document.querySelector('#swatchList')

    colors.forEach(item => {
      const li = document.createElement('li')
      li.className = 'swatch'

      const colorBox = document.createElement('span')
      colorBox.className = 'swatch-color'
      colorBox.style.background = item.color

      li.appendChild(colorBox)
      li.appendChild(document.createTextNode(item.name))
      list.appendChild(li)
    })
  </script>
</body>
</html>
